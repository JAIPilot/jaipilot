name: Bug report
description: Report a reproducible JAIPilot skill or plugin problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, proprietary source, private paths, and unsanitized build output.
        Report undisclosed vulnerabilities through SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and its effect on your work.
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - Review Java diff
        - Generate Java tests
        - Clean Java
        - Plugin installation or discovery
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the request, repository shape, and commands the agent ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JAIPilot version
      placeholder: v5.0.0
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: Codex or Claude Code
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      render: shell
    validations:
      required: false
