name: Bug report
description: Report a reproducible JAIPilot workflow failure
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve JAIPilot. Remove secrets and proprietary source before submitting.
        For undisclosed vulnerabilities, use the private process in `SECURITY.md` instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Generate Java tests
        - Clean or refactor Java
        - Validate candidate
        - Apply or discard
        - Plugin installation or update
        - Project inspection
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Share the smallest project shape, request, and sequence that reproduces the issue.
      placeholder: |
        1. Use JAIPilot v3.1.0 in Codex or Claude Code.
        2. Open a clean Maven project with ...
        3. Ask "..."
        4. Validation returns ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JAIPilot version
      placeholder: v3.1.0
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host tool and version
      placeholder: Codex / Claude Code / another Agent Skills host
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 x64, Temurin 21, Maven 3.9.11
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Structured result and diagnostics
      description: Paste sanitized JAIPilot JSON and relevant stderr or build output.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: The project build succeeds without JAIPilot.
        - label: I searched existing issues and discussions for this problem.
          required: true
