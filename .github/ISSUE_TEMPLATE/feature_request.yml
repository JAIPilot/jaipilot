name: Skill improvement
description: Propose a focused improvement to a JAIPilot Java workflow
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Java task does the current skill handle poorly?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Concrete example
      description: Provide a request and disposable repository shape that demonstrate the gap.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: How should the revised skill be forward-tested?
    validations:
      required: true
