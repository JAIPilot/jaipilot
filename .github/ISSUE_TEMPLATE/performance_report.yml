name: Performance report
description: Report a reproducible slow or resource-heavy JAIPilot journey
title: "performance: "
labels:
  - performance
body:
  - type: textarea
    id: journey
    attributes:
      label: Affected journey
      description: Identify the complete operation and the slow phase if known.
      placeholder: jaipilot_prove_diff for one changed class; clean build is 12s and proof adds 8s.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Reproduction environment
      description: Include JAIPilot version, OS/architecture, CPU/RAM, JDK, build tool, project/fixture, and cache state.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Raw observations
      description: Provide at least five comparable runs when the path is stable; separate JAIPilot, build, agent, and dependency-resolution time.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
