name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Validate JAIPilot distribution
        run: deno task check

      - name: Compile and check packaged ACP adapter
        shell: bash
        run: |
          case "${{ runner.os }}" in Windows) EXT=.exe ;; *) EXT= ;; esac
          deno compile -A --frozen --output "dist/jaipilot-acp$EXT" acp/main.ts
          deno run -A --frozen scripts/check-acp.ts "dist/jaipilot-acp$EXT"

      - name: Reject whitespace errors
        run: git show --check --format= HEAD

      - name: Validate installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

  build:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        run: test '${{ needs.validate.result }}' = success
