name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --ignore-scripts
      - name: Validate native CLI and packaged protocols
        shell: bash
        run: sh scripts/check.sh

      - name: Reject whitespace errors
        run: git show --check --format= HEAD

      - name: Validate installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

  build:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        run: test '${{ needs.validate.result }}' = success
