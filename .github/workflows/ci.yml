name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate skills-only plugin
        run: python3 scripts/validate-plugin.py

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
