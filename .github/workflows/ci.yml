name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install npm development metadata
        run: npm ci --ignore-scripts

      - name: Verify
        run: ./mvnw -B verify

      - name: Smoke test install script
        run: ./scripts/smoke-test-install.sh

      - name: Smoke test npm installation
        run: ./scripts/smoke-test-npm.sh
