name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Verify release identity
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: deno task check
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: JAIPilot ${{ github.ref_name }}
          body: |
            Fixes the CLI installer 404 caused by v1.1.0 containing only ACP archives. This release includes verified CLI binaries and checksums for all five supported platform targets, a Windows installer, an npm-compatible package, and the official Homebrew formula. Native installation and protocol checks must pass before promotion to latest.

            The JAIPilot CLI includes a local stdio MCP server for coding agents: prepare characterization tests before Java edits and verify the preserved baseline afterward. Configure `jaipilot mcp --repo /absolute/path/to/repository` in your MCP client.

            [Coding agent setup and tool contracts](https://github.com/JAIPilot/jaipilot/blob/main/docs/coding-agents.md)

            JAIPilot's ACP adapter brings six workflow-based Java testing outcomes to IntelliJ AI Assistant and other ACP clients.

            Generate tests, improve coverage, fix failing tests, stabilize flaky tests, test current changes, and lock existing behavior. Choose an outcome in the mode selector or use a slash command with an exact scope.

            The adapter uses your existing JAIPilot account, subscription, and credits. Builds and tests run through approved local IDE terminals. No remote workspace or bulk source archive is used. Approved command output and project metadata are sent to JAIPilot's managed model service.

            Download the archive for your platform, extract it, and configure the executable as a custom ACP agent. Public catalog availability depends on ACP Registry review.

            [IntelliJ setup and limitations](https://github.com/JAIPilot/jaipilot/blob/main/docs/intellij-acp.md)

  binaries:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Compile ACP adapter
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          case "$TARGET" in *windows*) EXT=.exe ;; *) EXT= ;; esac
          deno compile -A --frozen --target "$TARGET" --output "dist/package/jaipilot-acp$EXT" acp/main.ts
          cp LICENSE THIRD_PARTY_NOTICES.md dist/package/
          cp -R licenses dist/package/
          (cd dist/package && zip -r -9 "../jaipilot-acp-$TARGET.zip" "jaipilot-acp$EXT" LICENSE THIRD_PARTY_NOTICES.md licenses)
          (cd dist && sha256sum "jaipilot-acp-$TARGET.zip" > "jaipilot-acp-$TARGET.zip.sha256")
      - name: Compile CLI with MCP server
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in *windows*) EXT=.exe ;; *) EXT= ;; esac
          deno compile -A --frozen --target "$TARGET" --output "dist/jaipilot-$TARGET$EXT" cli/main.ts
          (cd dist && sha256sum "jaipilot-$TARGET$EXT" > "jaipilot-$TARGET$EXT.sha256")
          (cd dist/package && zip -r -9 "../jaipilot-notices-$TARGET.zip" LICENSE THIRD_PARTY_NOTICES.md licenses)
          (cd dist && sha256sum "jaipilot-notices-$TARGET.zip" > "jaipilot-notices-$TARGET.zip.sha256")
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/jaipilot-*
          fail_on_unmatched_files: true

  candidate:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package npm and Homebrew distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/npm
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir dist
          deno run -A scripts/package-release.ts dist
          cp -R npm/. dist/npm/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/npm/
          cp -R licenses dist/npm/
          npm pack ./dist/npm --pack-destination dist --ignore-scripts
          mv "dist/jaipilot-$(cat VERSION).tgz" dist/jaipilot-cli.tgz
          (cd dist && sha256sum jaipilot-cli.tgz > jaipilot-cli.tgz.sha256)
          cp install.sh install.ps1 dist/
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*.tgz dist/*.tgz.sha256 dist/jaipilot.rb dist/install.sh dist/install.ps1
      - name: Require every installation asset before exposing the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > dist/asset-names
          for TARGET in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            case "$TARGET" in *windows*) EXT=.exe ;; *) EXT= ;; esac
            for ASSET in "jaipilot-$TARGET$EXT" "jaipilot-$TARGET$EXT.sha256" "jaipilot-acp-$TARGET.zip" "jaipilot-acp-$TARGET.zip.sha256" "jaipilot-notices-$TARGET.zip" "jaipilot-notices-$TARGET.zip.sha256"; do
              grep -Fx "$ASSET" dist/asset-names
            done
          done
          for ASSET in install.sh install.ps1 jaipilot.rb jaipilot-cli.tgz jaipilot-cli.tgz.sha256; do
            grep -Fx "$ASSET" dist/asset-names
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  install:
    needs: candidate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run native platform gates
        run: deno task check
      - name: Download candidate packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern 'jaipilot.rb' --pattern "jaipilot-acp-${{ matrix.target }}.zip*" --dir dist
      - name: Fresh standalone installation on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAIPILOT_VERSION="$GITHUB_REF_NAME" JAIPILOT_INSTALL_DIR="$RUNNER_TEMP/standalone install/bin" sh install.sh
          "$RUNNER_TEMP/standalone install/bin/jaipilot" --version | grep -Fx "JAIPilot CLI $(cat VERSION)"
          deno run -A --frozen scripts/check-mcp.ts "$RUNNER_TEMP/standalone install/bin/jaipilot"
      - name: Fresh standalone installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Version $env:GITHUB_REF_NAME -InstallDir "$env:RUNNER_TEMP/standalone install/bin"
          $binary = "$env:RUNNER_TEMP/standalone install/bin/jaipilot.exe"
          if ((& $binary --version) -ne "JAIPilot CLI $(Get-Content VERSION)") { throw "Incorrect installed version" }
          deno run -A --frozen scripts/check-mcp.ts $binary
          if ($LASTEXITCODE -ne 0) { throw "Installed MCP server failed" }
      - name: Fresh npm installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm install" "https://github.com/JAIPilot/jaipilot/releases/download/$GITHUB_REF_NAME/jaipilot-cli.tgz"
          "$RUNNER_TEMP/npm install/bin/jaipilot" --version | grep -Fx "JAIPilot CLI $(cat VERSION)"
      - name: Fresh npm installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global --prefix "$env:RUNNER_TEMP/npm install" "https://github.com/JAIPilot/jaipilot/releases/download/$env:GITHUB_REF_NAME/jaipilot-cli.tgz"
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          if ((& "$env:RUNNER_TEMP/npm install/jaipilot.cmd" --version) -ne "JAIPilot CLI $(Get-Content VERSION)" -or $LASTEXITCODE -ne 0) { throw "Incorrect npm-installed version" }
      - name: Enable Linux Homebrew
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: echo '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"
      - name: Fresh Homebrew installation and formula test
        if: runner.os == 'macOS' || matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          TAP="$(brew --repository)/Library/Taps/jaipilot/homebrew-release-check"
          mkdir -p "$TAP/Formula"
          cp dist/jaipilot.rb "$TAP/Formula/jaipilot.rb"
          git -C "$TAP" init
          brew install jaipilot/release-check/jaipilot
          brew test jaipilot/release-check/jaipilot
      - name: Check installed ACP adapter
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in Windows) EXT=.exe ;; *) EXT= ;; esac
          if command -v sha256sum >/dev/null; then
            sha256sum -c "jaipilot-acp-${{ matrix.target }}.zip.sha256"
          else
            shasum -a 256 -c "jaipilot-acp-${{ matrix.target }}.zip.sha256"
          fi
          unzip "jaipilot-acp-${{ matrix.target }}.zip" -d acp
          cd ..
          deno run -A --frozen scripts/check-acp.ts "dist/acp/jaipilot-acp$EXT"

  publish:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the verified tap formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'jaipilot.rb' --dir dist
      - name: Update the official Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh repo clone JAIPilot/homebrew-tap "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp dist/jaipilot.rb "$RUNNER_TEMP/tap/Formula/jaipilot.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "JAIPilot releases"
          git config user.email "noreply@jaipilot.com"
          git add Formula/jaipilot.rb
          git diff --cached --quiet || git commit -m "JAIPilot $GITHUB_REF_NAME"
          gh auth setup-git
          git push origin HEAD:main
      - name: Promote only the verified complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

  latest:
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify the exact public curl command against latest
        if: runner.os != 'Windows'
        run: |
          export JAIPILOT_INSTALL_DIR="$RUNNER_TEMP/latest install/bin"
          curl -fsSL https://raw.githubusercontent.com/JAIPilot/jaipilot/main/install.sh | sh
          "$JAIPILOT_INSTALL_DIR/jaipilot" --version | grep -Fx "JAIPilot CLI $(cat VERSION)"
      - name: Verify the exact public PowerShell command against latest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JAIPILOT_INSTALL_DIR = "$env:RUNNER_TEMP/latest install/bin"
          irm https://github.com/JAIPilot/jaipilot/releases/latest/download/install.ps1 | iex
          if ((& "$env:JAIPILOT_INSTALL_DIR/jaipilot.exe" --version) -ne "JAIPilot CLI $(Get-Content VERSION)") { throw "Incorrect latest installation" }
      - name: Verify the public Homebrew command against the published tap
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install JAIPilot/tap/jaipilot
          brew test JAIPilot/tap/jaipilot
