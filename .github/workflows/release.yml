name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Verify release identity
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: deno task check
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: JAIPilot ACP ${{ github.ref_name }}
          body: |
            JAIPilot's ACP adapter brings six workflow-based Java testing outcomes to IntelliJ AI Assistant and other ACP clients.

            Generate tests, improve coverage, fix failing tests, stabilize flaky tests, test current changes, and lock existing behavior. Choose an outcome in the mode selector or use a slash command with an exact scope.

            The adapter uses your existing JAIPilot account, subscription, and credits. Builds and tests run through approved local IDE terminals. No remote workspace or bulk source archive is used. Approved command output and project metadata are sent to JAIPilot's managed model service.

            Download the archive for your platform, extract it, and configure the executable as a custom ACP agent. Public catalog availability depends on ACP Registry review.

            [IntelliJ setup and limitations](https://github.com/JAIPilot/jaipilot/blob/main/docs/intellij-acp.md)

  binaries:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Compile ACP adapter
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          case "$TARGET" in *windows*) EXT=.exe ;; *) EXT= ;; esac
          deno compile -A --frozen --target "$TARGET" --output "dist/package/jaipilot-acp$EXT" acp/main.ts
          cp LICENSE THIRD_PARTY_NOTICES.md dist/package/
          cp -R licenses dist/package/
          (cd dist/package && zip -r -9 "../jaipilot-acp-$TARGET.zip" "jaipilot-acp$EXT" LICENSE THIRD_PARTY_NOTICES.md licenses)
          (cd dist && sha256sum "jaipilot-acp-$TARGET.zip" > "jaipilot-acp-$TARGET.zip.sha256")
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/jaipilot-acp-*
          fail_on_unmatched_files: true

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
