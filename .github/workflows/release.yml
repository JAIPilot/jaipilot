name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Require all CI gates for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" > /tmp/runs.json
            RESULT=$(node -e 'const r=require("/tmp/runs.json").workflow_runs.filter(r=>r.name==="CI"); if(r.some(r=>r.status==="completed"&&r.conclusion!=="success")) console.log("failed"); else if(r.some(r=>r.status==="completed"&&r.conclusion==="success")) console.log("passed"); else console.log("waiting")')
            test "$RESULT" != failed
            if test "$RESULT" = passed; then break; fi
            sleep 10
          done
          test "$RESULT" = passed
      - name: Verify identity and create the immutable release tag
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          PREVIOUS=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          node -e 'const [previous,next]=process.argv.slice(1).map(v=>v.replace(/^v/,"").split(".").map(Number)); if(next[0]!==previous[0] || next[1]!==previous[1] || (next[2]!==previous[2] && next[2]!==previous[2]+1)) throw Error("CLI releases must advance by patch only");' "$PREVIOUS" "$TAG"
          if test "$GITHUB_REF_TYPE" = tag; then test "$GITHUB_REF_NAME" = "$TAG"; fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ steps.identity.outputs.tag }}
          name: JAIPilot ${{ steps.identity.outputs.tag }}
          body: |
            Adds opt-in JaCoCo coverage targets and Maven/Gradle coverage adapters. Configured minimums are preserved, line and branch requirements remain separate, and only fresh local test/report evidence can pass verification. Existing workflows remain compatible without the new flags.

            Build adapters currently install from source into the local Maven repository; Maven Central and Gradle Plugin Portal publisher setup is prepared. [Coverage commands and adapter setup](https://github.com/JAIPilot/jaipilot/blob/main/docs/build-tools.md)

            Small native Go executables require no Go, Node.js, or Deno installation for the standalone CLI, Homebrew CLI, or IntelliJ ACP adapter. The npm launcher uses your installed Node.js.

            Compressed, checksum-verified installers support macOS Intel/Apple Silicon, Linux x64/ARM64, and Windows x64. The existing CLI commands, MCP tool contracts, durable behavior baselines, authentication format, and bounded ACP terminal permissions are preserved. Raw assets remain available so older compiled CLIs can update to this release.

            Every supported platform must pass real Java baseline/regression tests, process cancellation, SDK protocol checks, and fresh standalone/npm package installation before promotion. Homebrew installation is also checked on macOS and Linux x64.

            The JAIPilot CLI includes a local stdio MCP server for coding agents: prepare characterization tests before Java edits and verify the preserved baseline afterward. Configure `jaipilot mcp --repo /absolute/path/to/repository` in your MCP client.

            [Coding agent setup and tool contracts](https://github.com/JAIPilot/jaipilot/blob/main/docs/coding-agents.md)

            JAIPilot's ACP adapter brings six workflow-based Java testing outcomes to IntelliJ AI Assistant and other ACP clients.

            Generate tests, improve coverage, fix failing tests, stabilize flaky tests, test current changes, and lock existing behavior. Choose an outcome in the mode selector or use a slash command with an exact scope.

            The adapter uses your existing JAIPilot account, subscription, and credits. Builds and tests run through approved local IDE terminals. No remote workspace or bulk source archive is used. Approved command output and project metadata are sent to JAIPilot's managed model service.

            Download the archive for your platform, extract it, and configure the executable as a custom ACP agent. Public catalog availability depends on ACP Registry review.

            [IntelliJ setup and limitations](https://github.com/JAIPilot/jaipilot/blob/main/docs/intellij-acp.md)

  binaries:
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build bounded native distributions
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/build-release.sh "$TARGET"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/jaipilot-*
          fail_on_unmatched_files: true

  candidate:
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    needs: [binaries, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Package npm and Homebrew distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/npm
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir dist
          node scripts/package-release.mjs dist
          cp -R npm/. dist/npm/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/npm/
          cp -R licenses dist/npm/
          npm pack ./dist/npm --pack-destination dist --ignore-scripts
          mv "dist/jaipilot-$(cat VERSION).tgz" dist/jaipilot-cli.tgz
          (cd dist && sha256sum jaipilot-cli.tgz > jaipilot-cli.tgz.sha256)
          cp install.sh install.ps1 dist/
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*.tgz dist/*.tgz.sha256 dist/jaipilot.rb dist/install.sh dist/install.ps1
      - name: Require every installation asset before exposing the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > dist/asset-names
          for TARGET in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            case "$TARGET" in *windows*) EXT=.exe ;; *) EXT= ;; esac
            for ASSET in "jaipilot-$TARGET$EXT" "jaipilot-$TARGET$EXT.sha256" "jaipilot-$TARGET$EXT.gz" "jaipilot-$TARGET$EXT.gz.sha256" "jaipilot-acp-$TARGET.zip" "jaipilot-acp-$TARGET.zip.sha256" "jaipilot-notices-$TARGET.zip" "jaipilot-notices-$TARGET.zip.sha256"; do
              grep -Fx "$ASSET" dist/asset-names
            done
          done
          for ASSET in install.sh install.ps1 jaipilot.rb jaipilot-cli.tgz jaipilot-cli.tgz.sha256; do
            grep -Fx "$ASSET" dist/asset-names
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

  install:
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    needs: [candidate, release]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --ignore-scripts
      - name: Run native platform gates
        run: go test -race ./...
      - name: Download candidate packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern 'jaipilot.rb' --pattern "jaipilot-acp-${{ matrix.target }}.zip*" --dir dist
      - name: Fresh standalone installation on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAIPILOT_VERSION="$RELEASE_TAG" JAIPILOT_INSTALL_DIR="$RUNNER_TEMP/standalone install/bin" sh install.sh
          "$RUNNER_TEMP/standalone install/bin/jaipilot" --version | grep -Fx "JAIPilot CLI $(cat VERSION)"
          node scripts/check-mcp.mjs "$RUNNER_TEMP/standalone install/bin/jaipilot"
      - name: Fresh standalone installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Version $env:RELEASE_TAG -InstallDir "$env:RUNNER_TEMP/standalone install/bin"
          $binary = "$env:RUNNER_TEMP/standalone install/bin/jaipilot.exe"
          if ((& $binary --version) -ne "JAIPilot CLI $(Get-Content VERSION)") { throw "Incorrect installed version" }
          node scripts/check-mcp.mjs $binary
          if ($LASTEXITCODE -ne 0) { throw "Installed MCP server failed" }
      - name: Fresh npm installation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm install" "https://github.com/JAIPilot/jaipilot/releases/download/$RELEASE_TAG/jaipilot-cli.tgz"
          "$RUNNER_TEMP/npm install/bin/jaipilot" --version | grep -Fx "JAIPilot CLI $(cat VERSION)"
      - name: Fresh npm installation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global --prefix "$env:RUNNER_TEMP/npm install" "https://github.com/JAIPilot/jaipilot/releases/download/$env:RELEASE_TAG/jaipilot-cli.tgz"
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          if ((& "$env:RUNNER_TEMP/npm install/jaipilot.cmd" --version) -ne "JAIPilot CLI $(Get-Content VERSION)" -or $LASTEXITCODE -ne 0) { throw "Incorrect npm-installed version" }
      - name: Enable Linux Homebrew
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: echo '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"
      - name: Verify fresh native bootstrap used by build adapters
        shell: bash
        run: |
          mkdir -p dist/bootstrap
          javac -d dist/bootstrap build-tools/core/src/main/java/com/jaipilot/build/*.java scripts/NativeBootstrapCheck.java
          java -Duser.home="$RUNNER_TEMP/adapter bootstrap" -cp dist/bootstrap NativeBootstrapCheck
      - name: Fresh Homebrew installation and formula test
        if: runner.os == 'macOS' || matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          TAP="$(brew --repository)/Library/Taps/jaipilot/homebrew-release-check"
          mkdir -p "$TAP/Formula"
          cp dist/jaipilot.rb "$TAP/Formula/jaipilot.rb"
          git -C "$TAP" init
          brew install jaipilot/release-check/jaipilot
          brew test jaipilot/release-check/jaipilot
      - name: Check installed ACP adapter
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in Windows) EXT=.exe ;; *) EXT= ;; esac
          if command -v sha256sum >/dev/null; then
            sha256sum -c "jaipilot-acp-${{ matrix.target }}.zip.sha256"
          else
            shasum -a 256 -c "jaipilot-acp-${{ matrix.target }}.zip.sha256"
          fi
          unzip "jaipilot-acp-${{ matrix.target }}.zip" -d acp
          cd ..
          node scripts/check-acp.mjs "dist/acp/jaipilot-acp$EXT"

  publish:
    needs: [install, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the official tap to contain the exact tested formula
        run: |
          mkdir verified
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern jaipilot.rb --dir verified
          for attempt in $(seq 1 120); do
            curl -fsSL "https://raw.githubusercontent.com/JAIPilot/homebrew-tap/main/Formula/jaipilot.rb" -o verified/published.rb
            if cmp -s verified/jaipilot.rb verified/published.rb; then break; fi
            sleep 10
          done
          cmp verified/jaipilot.rb verified/published.rb
      - name: Promote the complete verified native release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
