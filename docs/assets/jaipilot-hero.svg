<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">JAIPilot — Generate tests. Clean Java. Prove every change.</title>
  <desc id="desc">JAIPilot's proof-driven workflow moves Java changes through inspect, isolate, improve, prove, and apply.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1320" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2344"/>
      <stop offset="0.52" stop-color="#081426"/>
      <stop offset="1" stop-color="#050A13"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="80" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(190 42) rotate(52) scale(410 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientTransform="translate(1260 404) rotate(-137) scale(420 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93C5FD" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1400" height="460" rx="32" fill="url(#bg)"/>
  <rect width="1400" height="460" rx="32" fill="url(#glowBlue)"/>
  <rect width="1400" height="460" rx="32" fill="url(#glowGreen)"/>
  <rect width="1400" height="460" rx="32" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="458" rx="31" fill="none" stroke="#60A5FA" stroke-opacity="0.2" stroke-width="2"/>

  <g transform="translate(82 78)">
    <rect width="92" height="92" rx="24" fill="#09172C" stroke="#60A5FA" stroke-opacity="0.34"/>
    <path d="M26 25h22v32c0 12-8 20-20 20-7 0-13-3-17-8" fill="none" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m43 56 10 10 25-31" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="194" y="119" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="50" font-weight="760" letter-spacing="-1.5">JAIPilot</text>
  <text x="84" y="219" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="45" font-weight="720" letter-spacing="-1.2">Generate tests. Clean Java.</text>
  <text x="84" y="271" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="45" font-weight="720" letter-spacing="-1.2">Prove every change.</text>
  <text x="86" y="327" fill="#B8C7DD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20">Local-first engineering workflows for Codex and Claude Code.</text>
  <g transform="translate(86 357)">
    <circle cx="7" cy="7" r="7" fill="#34D399"/>
    <text x="26" y="14" fill="#D9E5F5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="560">No backend</text>
    <circle cx="160" cy="7" r="7" fill="#34D399"/>
    <text x="179" y="14" fill="#D9E5F5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="560">Real builds</text>
    <circle cx="302" cy="7" r="7" fill="#34D399"/>
    <text x="321" y="14" fill="#D9E5F5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17" font-weight="560">Drift-safe apply</text>
  </g>

  <g transform="translate(770 65)" filter="url(#shadow)">
    <rect width="546" height="330" rx="24" fill="#07111F" fill-opacity="0.88" stroke="#7DD3FC" stroke-opacity="0.2"/>
    <circle cx="28" cy="27" r="5" fill="#FB7185"/>
    <circle cx="46" cy="27" r="5" fill="#FBBF24"/>
    <circle cx="64" cy="27" r="5" fill="#34D399"/>
    <text x="88" y="33" fill="#7790AD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">verified-run / owner-service</text>
    <path d="M28 54H518" stroke="#20324A"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <circle cx="43" cy="88" r="10" fill="#2563EB" fill-opacity="0.22" stroke="#60A5FA"/>
      <path d="m38 88 4 4 7-9" fill="none" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="94" fill="#E5EDF8">INSPECT</text>
      <text x="191" y="94" fill="#7F95B0">Maven · 43 classes · JaCoCo</text>

      <path d="M43 104V126" stroke="#29405E" stroke-width="2"/>
      <circle cx="43" cy="142" r="10" fill="#0891B2" fill-opacity="0.22" stroke="#22D3EE"/>
      <path d="m38 142 4 4 7-9" fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="148" fill="#E5EDF8">ISOLATE</text>
      <text x="191" y="148" fill="#7F95B0">clean candidate · exact scope</text>

      <path d="M43 158V180" stroke="#29405E" stroke-width="2"/>
      <circle cx="43" cy="196" r="10" fill="#0D9488" fill-opacity="0.22" stroke="#2DD4BF"/>
      <path d="m38 196 4 4 7-9" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="202" fill="#E5EDF8">IMPROVE</text>
      <text x="191" y="202" fill="#7F95B0">tests + OpenRewrite-first cleanup</text>

      <path d="M43 212V234" stroke="#29405E" stroke-width="2"/>
      <circle cx="43" cy="250" r="10" fill="#059669" fill-opacity="0.22" stroke="#34D399"/>
      <path d="m38 250 4 4 7-9" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="256" fill="#E5EDF8">PROVE</text>
      <text x="191" y="256" fill="#7F95B0">79 tests · 100% target coverage</text>

      <path d="M43 266V288" stroke="#29405E" stroke-width="2"/>
      <circle cx="43" cy="304" r="10" fill="#16A34A" fill-opacity="0.22" stroke="#4ADE80"/>
      <path d="m38 304 4 4 7-9" fill="none" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="310" fill="#E5EDF8">APPLY</text>
      <text x="191" y="310" fill="#7F95B0">validated snapshot · transaction-safe</text>
    </g>
  </g>
</svg>
