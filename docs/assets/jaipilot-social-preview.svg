<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">JAIPilot — Proof-driven Java engineering</title>
  <desc id="desc">Generate tests, clean Java, and prove every change with Codex and Claude Code.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="20" x2="1190" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B55"/><stop offset="0.52" stop-color="#081426"/><stop offset="1" stop-color="#040811"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="150" x2="1110" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/><stop offset="0.54" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1080 550) rotate(-145) scale(530 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.28"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.055"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <g transform="translate(96 92)">
    <rect width="120" height="120" rx="32" fill="#09172C" stroke="#60A5FA" stroke-opacity="0.4"/>
    <path d="M34 31h31v43c0 17-11 27-28 27-10 0-18-4-24-11" fill="none" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m59 72 14 14 32-41" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="246" y="174" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="72" font-weight="780" letter-spacing="-2">JAIPilot</text>
  <text x="98" y="320" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="58" font-weight="740" letter-spacing="-1.4">Generate tests. Clean Java.</text>
  <text x="98" y="390" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="58" font-weight="740" letter-spacing="-1.4">Prove every change.</text>
  <text x="101" y="465" fill="#B8C7DD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="28">Proof-driven Java engineering for Codex and Claude Code.</text>
  <g transform="translate(102 526)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">
    <text x="0" y="0" fill="#93C5FD">INSPECT</text><text x="118" y="0" fill="#36506F">→</text>
    <text x="158" y="0" fill="#67E8F9">ISOLATE</text><text x="284" y="0" fill="#36506F">→</text>
    <text x="324" y="0" fill="#5EEAD4">IMPROVE</text><text x="450" y="0" fill="#36506F">→</text>
    <text x="490" y="0" fill="#6EE7B7">PROVE</text><text x="580" y="0" fill="#36506F">→</text>
    <text x="620" y="0" fill="#86EFAC">APPLY</text>
  </g>
  <text x="1100" y="570" text-anchor="end" fill="#7F95B0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">LOCAL-FIRST · BACKEND-FREE</text>
</svg>
