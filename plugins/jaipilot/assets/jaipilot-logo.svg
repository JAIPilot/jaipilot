    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#surface)"/>
  <rect x="25" y="25" width="462" height="462" rx="115" fill="none" stroke="#60A5FA" stroke-opacity="0.24" stroke-width="2"/>
  <path d="M154 132h118v166c0 52-35 86-88 86-32 0-58-11-78-33" fill="none" stroke="#F8FAFC" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m246 288 52 52 108-132" fill="none" stroke="url(#path)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="154" cy="132" r="12" fill="#60A5FA"/>
</svg>
