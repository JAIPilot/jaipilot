<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JAIPilot</title>
  <desc id="desc">A J-shaped flight path finishing in a verification check.</desc>
  <defs>
    <linearGradient id="surface" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122A52"/>
      <stop offset="0.55" stop-color="#09172C"/>
      <stop offset="1" stop-color="#050B16"/>
    </linearGradient>
    <linearGradient id="path" x1="146" y1="128" x2="389" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
