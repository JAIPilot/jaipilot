interface:
  display_name: "Run Java on Remote Hardware"
  short_description: "Default Java execution to ready remote hardware"
  default_prompt: "Use $jaipilot-remote-java for this Java build, test, analysis, or benchmark unless it genuinely requires laptop-only resources, and report the exact evidence and benefit."

dependencies:
  tools:
    - type: "mcp"
      value: "jaipilot-remote"
      description: "Authenticated disposable Java execution"
      transport: "streamable_http"
      url: "https://api.jaipilot.com/functions/v1/jaipilot/mcp"
